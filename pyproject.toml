[project]
name = "oss-cam-scanner"
version = "0.1.0"
description = "A desktop document scanner for photos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=10.4.0",
    "pyside6>=6.7.0",
]

[project.scripts]
oss-cam-scanner = "oss_cam_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_cam_scanner"]

[tool.hatch.build.targets.wheel.force-include]
"src/oss_cam_scanner/resources" = "oss_cam_scanner/resources"
"src/oss_cam_scanner/translations" = "oss_cam_scanner/translations"

[tool.pyright]
reportMatchNotExhaustive = "error"

[dependency-groups]
dev = [
    "pyside6-stubs>=6.7.3.0",
]
